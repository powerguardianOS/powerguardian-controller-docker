services:
  powerguardian:
    image: ghcr.io/powerguardianos/powerguardian-controller-docker:latest
    container_name: powerguardian
    network_mode: host
    restart: unless-stopped
    volumes:
      - pg-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    devices:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      # Optional: set to a fixed key to survive DB loss. Auto-generated on first start if not set.
      # PG_VAULT_KEY: ""
      PG_ADDR: "0.0.0.0:${PG_PORT:-9090}"
      PG_DB: "/data/powerguardian.db"
      CONTAINER_NAME: "powerguardian"
      CONTROLLER_IMAGE: "ghcr.io/powerguardianos/powerguardian-controller-docker"
      # Optional: GHCR_TOKEN for private image pulls
      # GHCR_TOKEN: ""

volumes:
  pg-data:
